name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Build public Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    environment: release

    env:
      CI: "true"
      EXPECTED_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER_SUBJECT }}

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release source and version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $expectedTag = "v$packageVersion"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion."
            }
          } elseif ($env:GITHUB_REF_NAME -ne "main") {
            throw "Manual public releases must run from main."
          }

          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The release commit is not part of origin/main."
          }

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          # Match CI: compile from a fresh Windows object cache.
          use-cache: false

      - name: Keep the Zig local cache apart from the global one
        # setup-zig points the local and global Zig caches at the same folder;
        # zig cc then loses the object it just compiled when it links
        # (lld-link: could not open .zig-cache\o\…\crouch_state_cache_test.obj).
        # A later GITHUB_ENV export overrides the action's.
        shell: pwsh
        run: '"ZIG_LOCAL_CACHE_DIR=$env:RUNNER_TEMP\zig-local-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Install locked dependencies
        run: npm ci

      - name: Verify the bundled official Vivox 5 runtime
        run: npm run verify:vivox-runtime

      - name: Detect the Windows signing configuration
        id: signing
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signed = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)
          if ($signed) {
            if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
              throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE_BASE64 is set."
            }
            if ([string]::IsNullOrWhiteSpace($env:EXPECTED_WINDOWS_PUBLISHER)) {
              throw "The WINDOWS_PUBLISHER_SUBJECT release environment variable is required when signing."
            }
          } else {
            Write-Warning "No Authenticode certificate is configured: this release will be UNSIGNED."
            "⚠️ No Authenticode certificate is configured — this release is **unsigned**. Verify downloads against SHA256SUMS.txt and the GitHub provenance attestation." >> $env:GITHUB_STEP_SUMMARY
          }
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Rebuild and verify the open-source shim
        shell: pwsh
        run: |
          npm run build:shim
          $rebuilt = Join-Path $env:GITHUB_WORKSPACE "native\steamshim\dist\steam_api64.dll"
          $bundled = Join-Path $env:GITHUB_WORKSPACE "resources\patches\steam_api64.dll"
          $rebuiltHash = (Get-FileHash -LiteralPath $rebuilt -Algorithm SHA256).Hash
          $bundledHash = (Get-FileHash -LiteralPath $bundled -Algorithm SHA256).Hash
          if ($rebuiltHash -ne $bundledHash) {
            throw "Bundled shim does not match its public source: $bundledHash != $rebuiltHash"
          }
          npm run test:native:menu-duo
          if ($LASTEXITCODE -ne 0) { throw "Native Duo/Trio menu tests failed." }

      - name: Test and build
        run: |
          $helperBundledHash = (Get-FileHash -LiteralPath "resources\diagnostics\ROTK.Diagnostics.exe" -Algorithm SHA256).Hash
          npm run build:diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic helper build failed." }
          $helperRebuiltHash = (Get-FileHash -LiteralPath "resources\diagnostics\ROTK.Diagnostics.exe" -Algorithm SHA256).Hash
          if ($helperBundledHash -ne $helperRebuiltHash) {
            throw "Bundled diagnostic helper does not match its public source."
          }
          npm run build:vivox
          if ($LASTEXITCODE -ne 0) { throw "Vivox release input validation failed." }
          $proxyHash = (Get-FileHash -LiteralPath "resources\patches\vivoxsdk_x64.dll" -Algorithm SHA256).Hash
          if ($proxyHash -ne "D74662295AF61D152A1869B2925D403AE984827BB55268CC20025D07EC9DABD5") {
            throw "Unexpected Vivox proxy SHA-256: $proxyHash"
          }
          npm run prepare:gameplay-patch
          $gameplayHash = (Get-FileHash -LiteralPath "resources\patches\dinput8.dll" -Algorithm SHA256).Hash
          if ($gameplayHash -ne "314041801EA331358CB73FD2FCE3DD1C71EDBB19A5B2654F285014AB5260E41F") {
            throw "Unexpected shotgun sprint proxy SHA-256: $gameplayHash"
          }
          # Les sidecars alimentent les overrides d'attestation embarqués :
          # une divergence signalerait chaque joueur honnête en écart.
          foreach ($patch in @("steam_api64.dll", "vivoxsdk_x64.dll", "vivoxsdk_x64_v5.dll", "dinput8.dll")) {
            $dllHash = (Get-FileHash -LiteralPath "resources\patches\$patch" -Algorithm SHA256).Hash.ToLowerInvariant()
            $sidecar = ((Get-Content -LiteralPath "resources\patches\$patch.sha256" -Raw) -split "\s+")[0]
            if ($sidecar -ne $dllHash) {
              throw "Le sidecar $patch.sha256 ne correspond pas au DLL : $sidecar != $dllHash"
            }
          }
          npm run build

      - name: Verify administrator startup with a sandboxed renderer
        run: node scripts/test-elevated-startup.mjs --require-administrator

      - name: Package NSIS installer
        run: npx electron-builder --win nsis --publish never --config.forceCodeSigning=${{ steps.signing.outputs.signed }}
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Verify packaged artifacts and Authenticode signatures
        shell: pwsh
        env:
          RELEASE_SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          $targets = @(
            Get-ChildItem -LiteralPath release -File -Filter "ROTK-Launcher-*.exe"
            Get-Item -LiteralPath "release\win-unpacked\ROTK Launcher.exe"
            Get-Item -LiteralPath "release\win-unpacked\resources\patches\steam_api64.dll"
            Get-Item -LiteralPath "release\win-unpacked\resources\patches\vivoxsdk_x64.dll"
            Get-Item -LiteralPath "release\win-unpacked\resources\patches\vivoxsdk_x64_v5.dll"
            Get-Item -LiteralPath "release\win-unpacked\resources\diagnostics\ROTK.Diagnostics.exe"
          )
          if ($targets.Count -lt 6) {
            throw "The installer, packaged launcher, runtime compatibility DLL or diagnostic helper is missing."
          }
          $helperPackagedHash = (Get-FileHash -LiteralPath "release\win-unpacked\resources\diagnostics\ROTK.Diagnostics.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $helperPackagedSidecar = ((Get-Content -LiteralPath "release\win-unpacked\resources\diagnostics\ROTK.Diagnostics.exe.sha256" -Raw) -split "\s+")[0]
          if ($helperPackagedSidecar -ne $helperPackagedHash) { throw "Packaged diagnostic helper sidecar mismatch (including Authenticode bytes)." }

          $vivoxRuntime = $targets |
            Where-Object { $_.Name -eq "vivoxsdk_x64_v5.dll" } |
            Select-Object -First 1
          $vivoxHash = (Get-FileHash -LiteralPath $vivoxRuntime.FullName -Algorithm SHA256).Hash
          $vivoxProxy = $targets |
            Where-Object { $_.Name -eq "vivoxsdk_x64.dll" } |
            Select-Object -First 1
          $proxyHash = (Get-FileHash -LiteralPath $vivoxProxy.FullName -Algorithm SHA256).Hash
          if ($proxyHash -ne "D74662295AF61D152A1869B2925D403AE984827BB55268CC20025D07EC9DABD5") {
            throw "Unexpected packaged Vivox proxy SHA-256: $proxyHash"
          }

          if ($vivoxHash -ne "33A7F704EDA23DDA9CCBD9EBA1FDA2F0589211E9C61EC9D1F9C797ACC624EA44") {
            throw "Unexpected packaged Vivox 5 runtime SHA-256: $vivoxHash"
          }
          $vivoxSignature = Get-AuthenticodeSignature -LiteralPath $vivoxRuntime.FullName
          if ($vivoxSignature.Status -ne "Valid" -or -not $vivoxSignature.SignerCertificate) {
            throw "The packaged Vivox 5 runtime has an invalid Authenticode signature."
          }
          if ($vivoxSignature.SignerCertificate.Subject -notmatch "CN=Unity Technologies SF") {
            throw "The packaged Vivox 5 runtime was not signed by Unity Technologies SF."
          }
          if (-not $vivoxSignature.TimeStamperCertificate) {
            throw "The packaged Vivox 5 runtime has no trusted timestamp."
          }

          if ($env:RELEASE_SIGNED -ne "true") {
            Write-Warning "Unsigned release: skipping Authenticode verification."
            "Authenticode publisher: none (unsigned release)" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $publisher = $null
          $projectTargets = $targets | Where-Object { $_.Name -notin @("vivoxsdk_x64_v5.dll", "vivoxsdk_x64.dll") }
          foreach ($target in $projectTargets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
              throw "Invalid Authenticode signature on $($target.Name): $($signature.Status)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "The Authenticode signature on $($target.Name) has no trusted timestamp."
            }
            if ($null -eq $publisher) {
              $publisher = $signature.SignerCertificate.Subject
            } elseif ($publisher -ne $signature.SignerCertificate.Subject) {
              throw "Release files were signed by different publisher identities."
            }
          }
          if ($publisher -ne $env:EXPECTED_WINDOWS_PUBLISHER) {
            throw "Unexpected Authenticode publisher: $publisher"
          }
          "Authenticode publisher: $publisher" >> $env:GITHUB_STEP_SUMMARY

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Name -match '\.(exe|blockmap)$' } |
            Sort-Object Name
          if (-not $artifacts) { throw "No release artifact was generated." }
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($artifact.Name)"
          }
          $lines | Set-Content -LiteralPath release\SHA256SUMS.txt -Encoding ascii

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/ROTK-Launcher-*.exe

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rotk-launcher-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/ROTK-Launcher-*.exe
            release/ROTK-Launcher-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

      - name: Create or refresh the unpublished draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseFiles = @(
            Get-ChildItem -LiteralPath release -File |
              Where-Object { $_.Name -match '\.(exe|blockmap)$' } |
              Select-Object -ExpandProperty FullName
          )
          $releaseFiles += (Resolve-Path -LiteralPath release\SHA256SUMS.txt).Path
          # latest.yml lets the in-app updater resolve the newest published version.
          $releaseFiles += (Resolve-Path -LiteralPath release\latest.yml).Path
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw "Refusing to replace artifacts of an already published release."
            }
            gh release upload $env:GITHUB_REF_NAME @releaseFiles --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @releaseFiles `
              --verify-tag `
              --generate-notes `
              --draft `
              --title "ROTK Launcher $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) { throw "Draft release artifact upload failed." }
